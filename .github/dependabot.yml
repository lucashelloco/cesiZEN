# Veille automatisée des dépendances — alimente le backlog de maintenance.
# Documentation : https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Dépendances npm de l'application
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "deps"
    # On ignore les montées de version MAJEURES : elles introduisent des
    # changements cassants (ex. Next 16, Prisma 7, Zod 4) qui doivent être
    # évalués et testés manuellement, et non mergés automatiquement.
    # Les majeurs restent suivis via la veille (CHANGELOG, alertes sécurité).
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Regroupe les mises à jour mineures/patch dans une seule PR pour
      # limiter le bruit et faciliter la revue.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Mises à jour des actions GitHub utilisées dans la CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
